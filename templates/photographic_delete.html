{% extends "base.html" %}
{% block content %}
<main class="page form-page"><a href="{% url 'photographic_detail' object.pk %}" class="back-link">← Wróć do zdjęcia</a><section class="panel"><h1>Usunąć to zdjęcie?</h1><img class="delete-preview" src="data:image/{{ object.format|lower }};base64,{{ object.get_awers }}" alt="{{ object.description|default:'Zdjęcie do usunięcia' }}"><p>{{ object.description|default:'Zdjęcie bez opisu' }}</p><p class="muted">Usunięte zostaną także jego wersja kolorowa i oznaczenia twarzy. Tej operacji nie można cofnąć.</p><form method="post" data-busy-label="Usuwanie…">{% csrf_token %}<div class="actions"><button type="submit" class="btn btn-danger">Usuń zdjęcie</button><a class="btn btn-secondary" href="{% url 'photographic_detail' object.pk %}">Anuluj</a></div></form></section></main>
{% endblock %}
